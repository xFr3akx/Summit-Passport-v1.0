name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_import_places.py
      - name: Select exact first 10 true unresolved records
        run: python3 scripts/list_true_backlog_first10.py
      - name: Generate reviewed first 10 staging package
        run: python3 scripts/apply_first10_decisions.py
      - name: Validate reviewed first 10 staging package
        run: python3 scripts/validate_first10_staging.py
      - uses: actions/upload-artifact@v4
        with:
          name: first10-reviewed-staging
          path: |
            data/first10_backlog/selection.json
            data/first10_backlog/decisions.json
            data/first10_backlog/summary.json
            data/first10_backlog/ready_patch.json
            data/first10_backlog/needs_review.json
            data/first10_backlog/catalog_working_next.json
            data/first10_backlog/catalog_main_candidate.json
          if-no-files-found: error
