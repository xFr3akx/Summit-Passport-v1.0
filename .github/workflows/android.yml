name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_import_places.py
      - run: python3 scripts/export_poland_backlog.py --limit 522 --offset 0 --output data/poland_backlog_batch_001.csv
      - run: python3 scripts/geocode_poland_batch.py data/poland_backlog_batch_001.csv --output data/poland_backlog_batch_001_geocoded.json
      - run: python3 scripts/validate_poland_geocoded.py data/poland_backlog_batch_001_geocoded.json --output data/poland_backlog_batch_001_validated.json --ready-csv data/poland_backlog_batch_001_ready.csv
      - run: python3 scripts/crosscheck_poland_osm.py data/poland_backlog_batch_001_ready.csv --output data/poland_backlog_batch_001_osm.json --crosschecked-csv data/poland_backlog_batch_001_crosschecked.csv
      - name: Show Poland backlog validation summary
        run: python3 -c "import json,collections; d=json.load(open('data/poland_backlog_batch_001_validated.json',encoding='utf-8')); o=json.load(open('data/poland_backlog_batch_001_osm.json',encoding='utf-8')); print('candidate',collections.Counter(x['validation_status'] for x in d)); print('osm',collections.Counter(x['status'] for x in o['results'])); [print(x['status'],x['name'],x['reason']) for x in o['results']]"
      - uses: actions/upload-artifact@v4
        with:
          name: poland-backlog-batch-001
          path: |
            data/poland_backlog_batch_001.csv
            data/poland_backlog_batch_001_geocoded.json
            data/poland_backlog_batch_001_validated.json
            data/poland_backlog_batch_001_ready.csv
            data/poland_backlog_batch_001_osm.json
            data/poland_backlog_batch_001_crosschecked.csv
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: error
