name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_import_places.py
      - name: Fast live OSM audit for backlog positions 11-110
        run: python3 scripts/process_next100_fast_live.py
      - name: Validate fast next-100 staging
        run: python3 scripts/validate_next100_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: next100-fast-live-staging
          path: data/next100_fast/
          if-no-files-found: error
