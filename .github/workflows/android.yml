name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_import_places.py
      - name: Select exact first 10 true unresolved records
        run: python3 scripts/list_true_backlog_first10.py
      - uses: actions/upload-artifact@v4
        with:
          name: first10-selection
          path: data/first10_backlog/selection.json
          if-no-files-found: error
