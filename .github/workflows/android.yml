name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_import_places.py
      - name: Audit positions 11-110 against existing 0.6.4 evidence
        run: python3 scripts/process_next100_existing_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: next100-existing-evidence
          path: data/next100_evidence/
          if-no-files-found: error
