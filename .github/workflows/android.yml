name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_import_places.py
      - name: Process backlog positions 11-110
        run: python3 scripts/process_true_backlog_next100.py
      - name: Validate next 100 staging package
        run: python3 scripts/validate_next100_staging.py
      - uses: actions/upload-artifact@v4
        with:
          name: next100-reviewed-staging
          path: |
            data/next100_backlog/selection.json
            data/next100_backlog/results.json
            data/next100_backlog/summary.json
            data/next100_backlog/ready_patch.json
            data/next100_backlog/needs_review.json
            data/next100_backlog/possible_duplicates.json
            data/next100_backlog/catalog_working_next.json
            data/next100_backlog/catalog_main_candidate.json
          if-no-files-found: error
