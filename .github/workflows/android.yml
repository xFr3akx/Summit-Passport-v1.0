name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_import_places.py
      - name: Prepare complete Poland + Germany backlog package
        run: python3 scripts/prepare_catalog_backlog_all.py --output-dir data/full_backlog --photon-delay 0.45 --overpass-delay 0.20
      - name: Verify complete backlog coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/full_backlog/summary.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          expected={'PL':522,'DE':331}
          assert s['backlog_by_country']==expected, (s['backlog_by_country'], expected)
          assert s['backlog_total']==853, s['backlog_total']
          assert sum(s['status_counts'].values())==853, s['status_counts']
          assert s['stable_ids_preserved'] is True
          assert s['production_catalog_overwritten'] is False
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-pl-de-backlog-package
          path: data/full_backlog/
          if-no-files-found: error
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: error
