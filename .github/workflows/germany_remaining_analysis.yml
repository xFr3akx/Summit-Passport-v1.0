name: Germany remaining analysis
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify all remaining Germany records
        run: python3 scripts/classify_germany_remaining.py
      - uses: actions/upload-artifact@v4
        with:
          name: germany-remaining-review
          path: |
            data/germany_remaining_review.json
            data/germany_remaining_review_summary.json
          if-no-files-found: error
